<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحكمة السرية</title>
  <style>
    :root { --bg: #090d16; --panel: #111827; --accent: #f43f5e; --gold: #fbbf24; --text: #f8fafc; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 12px; }
    .container { max-width: 550px; margin: 0 auto; text-align: center; }
    .panel { background: var(--panel); border: 1px solid #1e293b; border-radius: 12px; padding: 15px; margin-top: 12px; }
    .status-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .p-card { background: #030712; border: 1px solid #1e293b; border-radius: 8px; padding: 8px; font-size: 0.85em; }
    .badge { font-size: 0.7em; background: #374151; padding: 2px 5px; border-radius: 4px; }
    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .card-item { background: #1f2937; border: 2px solid #374151; border-radius: 8px; padding: 10px; cursor: pointer; text-align: right; font-size: 0.85em; }
    .card-item.selected { border-color: var(--accent); background: #2d1a24; }
    button { background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
    button.sec { background: #374151; }
    select, input, textarea { width: 100%; padding: 10px; background: #030712; border: 1px solid #1e293b; color: #fff; border-radius: 6px; margin-bottom: 8px; box-sizing: border-box; }
    .narrative-box { background: #030712; border-right: 3px solid var(--gold); padding: 10px; text-align: right; font-size: 0.9em; line-height: 1.5; margin-bottom: 10px; }
    .offer-box { background: #2a2415; border: 1px solid var(--gold); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2 style="color: var(--accent);">🏛️ المحكمة السرية</h2>

  <!-- إعداد الأسماء -->
  <div id="screen-setup" class="panel">
    <h3>إعداد الطاولة</h3>
    <input type="text" id="input-names" placeholder="الأسماء تفصلها فاصلة (أحمد, سارة, خالد)" value="أحمد, سارة, خالد">
    <button onclick="startGame()">بدء اللعبة</button>
  </div>

  <!-- الشاشة الرئيسية -->
  <div id="screen-game" style="display:none;">
    <div class="status-bar" id="ui-status"></div>

    <!-- السحب والدور -->
    <div id="phase-action" class="panel">
      <div id="curtain">
        <h3 id="ui-turn-title">سلم الهاتف</h3>
        <button onclick="revealTurn()">عرض الأوراق والدور السري</button>
      </div>

      <div id="deck-area" style="display:none;">
        <h3 id="ui-player-name">-</h3>

        <!-- إشعار عرض التحالف المعلق -->
        <div id="ui-alliance-offer" class="offer-box" style="display:none;">
          <p id="ui-offer-text" style="margin:5px 0; font-size:0.85em;"></p>
          <div style="display:flex; gap:5px;">
            <button onclick="respondAlliance(true)">قبول 🤝</button>
            <button onclick="respondAlliance(false)" class="sec">رفض ❌</button>
          </div>
        </div>

        <div class="cards-grid" id="ui-cards-container"></div>

        <!-- صندوق الحركة المخصصة -->
        <div id="custom-box" style="display:none;">
          <textarea id="input-custom-act" placeholder="اكتب ما تريد فعله ليحلله القاضي (مثلاً: سأقوم بابتزاز أحمد)..."></textarea>
        </div>

        <div id="target-box" style="display:none;">
          <label style="font-size:0.8em;">اختر الهدف:</label>
          <select id="select-target"></select>
        </div>

        <button onclick="submitAction()">تأكيد الحركة</button>
      </div>
    </div>

    <!-- مرحلة النقاش والتحقيق -->
    <div id="phase-debate" class="panel" style="display:none;">
      <h3>📜 تقرير المحكمة والتحقيق</h3>
      <div class="narrative-box" id="ui-narrative">...</div>

      <!-- أدوات الحشد والتحالف السريع -->
      <div style="display:flex; gap:5px; margin-bottom:8px;">
        <button onclick="triggerMobilize()" class="sec">📢 حشد ضد لاعب</button>
        <button onclick="triggerEmergencyAlliance()" class="sec">🤝 طلب تحالف طارئ</button>
      </div>

      <button onclick="startGroupVote()">الانتقال للتصويت الجماعي</button>
    </div>

    <!-- التصويت الجماعي -->
    <div id="phase-vote" class="panel" style="display:none;">
      <h3>⚖️ جلسة الحكم الجماعي</h3>
      <select id="select-group-accused"></select>
      <button onclick="processGroupVote()">إصدار الحكم النهائي</button>
    </div>
  </div>
</div>

<script>
  // مسبح بطاقات ديناميكي
  const ALL_CARDS = [
    { id: 'ATTACK', name: '🗡️ إدانة ظلية', desc: 'خصم 3 سمعة من الهدف', reqTarget: true, repChange: 0, targetRepChange: -3 },
    { id: 'BOOST', name: '🛡️ تعزيز نفوذ', desc: '+2 سمعة لك', reqTarget: false, repChange: 2, targetRepChange: 0 },
    { id: 'ALLIANCE_OFFER', name: '🤝 عرض تحالف', desc: 'إرسال طلب تحالف سري للهدف للقبول أو الرفض', reqTarget: true, repChange: 0, targetRepChange: 0 },
    { id: 'CUSTOM_ACT', name: '📦 صندوق الاختيار الحر', desc: 'اكتب حركتك الخاصة بالكامل ليحللها AI', reqTarget: true, repChange: 0, targetRepChange: 0 }
  ];

  let gameState = { players: [], alliances: {}, pendingAllianceOffers: {}, currentTurn: 0, actions: [], selectedCard: null };

  function startGame() {
    const names = document.getElementById('input-names').value.split(',').map(n => n.trim()).filter(n => n);
    if (names.length < 2) return alert("ادخل اسمين على الأقل");
    gameState.players = names.map((n, i) => ({ id: i, name: n, reputation: 10 }));
    document.getElementById('screen-setup').style.display = 'none';
    document.getElementById('screen-game').style.display = 'block';
    startRound();
  }

  function startRound() {
    gameState.currentTurn = 0;
    gameState.actions = [];
    renderStatus();
    showCurtain();
  }

  function renderStatus() {
    document.getElementById('ui-status').innerHTML = gameState.players.map(p => `
      <div class="p-card ${p.reputation <= 0 ? 'dead' : ''}">
        <b>${p.name}</b><br>${p.reputation <= 0 ? '💀 مقصى' : p.reputation + ' ⭐'}
      </div>
    `).join('');
  }

  function showCurtain() {
    const p = gameState.players[gameState.currentTurn];
    if (p.reputation <= 0) { nextTurn(); return; }
    document.getElementById('phase-action').style.display = 'block';
    document.getElementById('phase-debate').style.display = 'none';
    document.getElementById('phase-vote').style.display = 'none';
    document.getElementById('curtain').style.display = 'block';
    document.getElementById('deck-area').style.display = 'none';
    document.getElementById('ui-turn-title').innerText = `سلم الهاتف إلى: ${p.name}`;
  }

  function revealTurn() {
    const p = gameState.players[gameState.currentTurn];
    document.getElementById('curtain').style.display = 'none';
    document.getElementById('deck-area').style.display = 'block';
    document.getElementById('ui-player-name').innerText = p.name;

    // فحص عروض التحالف المعلقة
    const offerBox = document.getElementById('ui-alliance-offer');
    if (gameState.pendingAllianceOffers[p.id] !== undefined) {
      const senderIdx = gameState.pendingAllianceOffers[p.id];
      document.getElementById('ui-offer-text').innerText = `🤝 وصلك عرض تحالف سري من [${gameState.players[senderIdx].name}]!`;
      offerBox.style.display = 'block';
    } else {
      offerBox.style.display = 'none';
    }

    // عرض 3 أوراق عشوائية متغيرة في كل مرة
    const container = document.getElementById('ui-cards-container');
    container.innerHTML = '';
    let hand = [...ALL_CARDS].sort(() => 0.5 - Math.random()).slice(0, 3);

    hand.forEach(card => {
      container.innerHTML += `
        <div class="card-item" onclick="selectCard('${card.id}', this)">
          <b>${card.name}</b>
          <div style="font-size:0.75em; color:#9ca3af;">${card.desc}</div>
        </div>
      `;
    });
  }

  function respondAlliance(accepted) {
    const p = gameState.players[gameState.currentTurn];
    const senderIdx = gameState.pendingAllianceOffers[p.id];

    if (accepted) {
      const key = [Math.min(p.id, senderIdx), Math.max(p.id, senderIdx)].join('-');
      gameState.alliances[key] = true;
      alert("🤝 تم عقد التحالف السري بينكما بنجاح!");
    } else {
      alert("❌ قمت برفض عرض التحالف.");
    }
    delete gameState.pendingAllianceOffers[p.id];
    document.getElementById('ui-alliance-offer').style.display = 'none';
    renderStatus();
  }

  function selectCard(cardId, el) {
    document.querySelectorAll('.card-item').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    gameState.selectedCard = ALL_CARDS.find(c => c.id === cardId);

    document.getElementById('custom-box').style.display = cardId === 'CUSTOM_ACT' ? 'block' : 'none';
    const targetBox = document.getElementById('target-box');

    if (gameState.selectedCard.reqTarget) {
      targetBox.style.display = 'block';
      const select = document.getElementById('select-target');
      select.innerHTML = '';
      gameState.players.forEach((pl, idx) => {
        if (idx !== gameState.currentTurn && pl.reputation > 0) {
          select.innerHTML += `<option value="${idx}">${pl.name}</option>`;
        }
      });
    } else {
      targetBox.style.display = 'none';
    }
  }

  async function submitAction() {
    if (!gameState.selectedCard) return alert("اختر بطاقة!");
    let targetIdx = gameState.selectedCard.reqTarget ? parseInt(document.getElementById('select-target').value) : null;
    let customResult = null;

    if (gameState.selectedCard.id === 'CUSTOM_ACT') {
      const text = document.getElementById('input-custom-act').value;
      if (!text) return alert("اكتب حركتك في الصندوق!");
      const p = gameState.players[gameState.currentTurn];
      const targetName = targetIdx !== null ? gameState.players[targetIdx].name : '';

      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'analyze_custom_card', player: p.name, text, targetName })
      });
      customResult = await res.json();
    }

    gameState.actions.push({
      playerIdx: gameState.currentTurn,
      card: gameState.selectedCard,
      targetIdx,
      customResult
    });

    nextTurn();
  }

  function nextTurn() {
    gameState.currentTurn++;
    if (gameState.currentTurn < gameState.players.length) {
      showCurtain();
    } else {
      resolveRoundServer();
    }
  }

  async function resolveRoundServer() {
    document.getElementById('phase-action').style.display = 'none';
    document.getElementById('phase-debate').style.display = 'block';
    document.getElementById('ui-narrative').innerText = "جاري تجميع التحركات وتحليل القاضي...";

    const res = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'resolve_round',
        players: gameState.players,
        actions: gameState.actions,
        alliances: gameState.alliances,
        pendingAllianceOffers: gameState.pendingAllianceOffers
      })
    });

    const data = await res.json();
    gameState.players = data.players;
    gameState.alliances = data.alliances;
    gameState.pendingAllianceOffers = data.pendingAllianceOffers;
    document.getElementById('ui-narrative').innerText = data.narrative;
    renderStatus();
  }

  function triggerMobilize() {
    const target = prompt("ادخل اسم اللاعب المراد الحشد ضده علناً:");
    if (target) alert(`📢 تم رفع راية الحشد ضد [${target}]! أقيموا الدلائل عليه في التصويت!`);
  }

  function triggerEmergencyAlliance() {
    alert("🤝 يمكنك الآن إرسال عرض تحالف خفي في دورك القادم للنجاة وتقاسم الضرر!");
  }

  function startGroupVote() {
    document.getElementById('phase-debate').style.display = 'none';
    document.getElementById('phase-vote').style.display = 'block';
    const select = document.getElementById('select-group-accused');
    select.innerHTML = '<option value="">-- التغاضي (عدم اتهام أحد) --</option>';
    gameState.players.forEach((p, idx) => {
      if (p.reputation > 0) select.innerHTML += `<option value="${idx}">${p.name}</option>`;
    });
  }

  async function processGroupVote() {
    const val = document.getElementById('select-group-accused').value;
    const accusedIdx = val !== "" ? parseInt(val) : null;

    const res = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'resolve_group_vote',
        players: gameState.players,
        accusedIdx,
        actions: gameState.actions
      })
    });

    const data = await res.json();
    gameState.players = data.players;
    alert(data.msg);

    const alive = gameState.players.filter(p => p.reputation > 0);
    if (alive.length <= 1) {
      alert(`🎉 انتهت الجلسة! الفائز هو: ${alive[0]?.name || "لا أحد"}`);
      location.reload();
    } else {
      startRound();
    }
  }
</script>
</body>
</html>
