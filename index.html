<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحكمة السرية</title>
  <style>
    :root { --bg: #090d16; --panel: #111827; --accent: #f43f5e; --gold: #fbbf24; --text: #f8fafc; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    .container { max-width: 600px; margin: 0 auto; text-align: center; }
    .panel { background: var(--panel); border: 1px solid #1e293b; border-radius: 12px; padding: 16px; margin-top: 15px; }
    .status-bar { display: flex; justify-content: space-around; background: #030712; padding: 10px; border-radius: 8px; flex-wrap: wrap; gap: 5px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 15px 0; }
    .card { background: #1f2937; border: 2px solid #374151; border-radius: 8px; padding: 12px; cursor: pointer; text-align: center; }
    .card:hover, .card.selected { border-color: var(--accent); background: #2d1a24; }
    .card.forced { border-color: var(--gold); background: #2a2415; }
    button { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; }
    button.secondary { background: #374151; }
    select, input { width: 100%; padding: 10px; background: #030712; border: 1px solid #1e293b; color: #fff; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
    .narrative-box { background: #030712; border-right: 4px solid var(--gold); padding: 12px; text-align: right; line-height: 1.6; margin-bottom: 15px; white-space: pre-line; }
  </style>
</head>
<body>

<div class="container">
  <h2 style="color: var(--accent);">🏛️ المحكمة السرية</h2>

  <!-- 1. الإعداد -->
  <div id="screen-setup" class="panel">
    <h3>إعداد الجلسة</h3>
    <input type="text" id="input-players" value="سارة, يوسف, خالد">
    <button onclick="startGame()">بدء اللعبة</button>
  </div>

  <!-- 2. الشاشة الرئيسية -->
  <div id="screen-game" style="display:none;">
    <div class="status-bar" id="ui-status"></div>

    <!-- مرحلة السحب واللعب الفردي -->
    <div id="phase-action" class="panel">
      <div id="curtain">
        <h3 id="ui-turn-title">دور: -</h3>
        <p>مرر الهاتف للاعب واضغط للبدء</p>
        <button onclick="loadPlayerCards()">عرض خيارات الذكاء الاصطناعي</button>
      </div>

      <div id="deck-area" style="display:none;">
        <h3 id="ui-player-name">اختياراتك الدورية:</h3>
        <p id="ui-card-instruction" style="font-size:0.85em; color:#9ca3af;"></p>
        
        <div class="card-grid" id="ui-cards-container"></div>

        <div id="target-box" style="display:none;">
          <label style="font-size:0.8em;">اختر الخصم المستهدف:</label>
          <select id="select-target"></select>
        </div>

        <button onclick="submitAction()">تأكيد الحركة وتمرير الهاتف</button>
      </div>
    </div>

    <!-- مرحلة الراوي والنقاش العلني -->
    <div id="phase-debate" class="panel" style="display:none;">
      <h3>📜 تقرير المحكمة والنقاش</h3>
      <div class="narrative-box" id="ui-narrative">...</div>
      <p style="font-weight:bold; color:var(--gold);">تناقشوا علنياً الآن حول المتهم قبل بدء التصويت الجماعي!</p>
      <button onclick="startGroupVote()">الانتقال للتصويت الجماعي العلني</button>
    </div>

    <!-- مرحلة التصويت الجماعي -->
    <div id="phase-vote" class="panel" style="display:none;">
      <h3>⚖️ التصويت الجماعي الموحد</h3>
      <p style="font-size:0.85em; color:var(--accent);">اتفقوا معاً واختاروا المتهم الرئيسي، أو اتركوا الخيار فارغاً للتغاضي:</p>
      
      <select id="select-group-accused"></select>

      <button onclick="processGroupVote()">إعلان حسم التصويت الجماعي</button>
    </div>
  </div>
</div>

<script>
  let gameState = { players: [], currentTurn: 0, actions: [], currentCardsData: null, selectedCard: null };

  function startGame() {
    const names = document.getElementById('input-players').value.split(',').map(n => n.trim()).filter(n => n);
    gameState.players = names.map((n, i) => ({ id: i, name: n, reputation: 10 }));
    document.getElementById('screen-setup').style.display = 'none';
    document.getElementById('screen-game').style.display = 'block';
    startRound();
  }

  function startRound() {
    gameState.currentTurn = 0;
    gameState.actions = [];
    renderStatus();
    showCurtain();
  }

  function renderStatus() {
    document.getElementById('ui-status').innerHTML = gameState.players
      .map(p => `<div>${p.name}: ${p.reputation <= 0 ? '💀' : p.reputation + ' ⭐'}</div>`).join('');
  }

  function showCurtain() {
    const p = gameState.players[gameState.currentTurn];
    if (p.reputation <= 0) { nextTurn(); return; }

    document.getElementById('phase-action').style.display = 'block';
    document.getElementById('phase-debate').style.display = 'none';
    document.getElementById('phase-vote').style.display = 'none';

    document.getElementById('curtain').style.display = 'block';
    document.getElementById('deck-area').style.display = 'none';
    document.getElementById('ui-turn-title').innerText = `سلم الهاتف إلى: ${p.name}`;
  }

  async function loadPlayerCards() {
    const p = gameState.players[gameState.currentTurn];
    document.getElementById('curtain').style.display = 'none';
    document.getElementById('deck-area').style.display = 'block';
    document.getElementById('ui-player-name').innerText = `دور: ${p.name}`;
    document.getElementById('ui-cards-container').innerHTML = "جاري ابتكار أوراقك بالذكاء الاصطناعي...";

    try {
      const res = await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'generate_cards', player: p.name, reputation: p.reputation })
      });
      
      gameState.currentCardsData = await res.json();
      renderCards();
    } catch (e) {
      alert("حدث خطأ أثناء سحب الأوراق");
    }
  }

  function renderCards() {
    const container = document.getElementById('ui-cards-container');
    container.innerHTML = '';
    const { isForced, cards } = gameState.currentCardsData;

    document.getElementById('ui-card-instruction').innerText = isForced 
      ? "⚠️ بطاقة إجبارية من المحكمة! ليس لديك خيار آخر."
      : "اختر بطاقة واحدة فقط من الخيارات التالية:";

    cards.forEach((card, idx) => {
      container.innerHTML += `
        <div class="card ${isForced ? 'forced' : ''}" onclick="selectCard(${idx}, this)">
          <b>${card.name}</b>
          <p style="font-size:0.75em; color:#9ca3af;">${card.desc}</p>
        </div>
      `;
    });

    if (isForced) selectCard(0, container.children[0]);
  }

  function selectCard(idx, el) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    gameState.selectedCard = gameState.currentCardsData.cards[idx];

    const targetBox = document.getElementById('target-box');
    if (gameState.selectedCard.requiresTarget) {
      targetBox.style.display = 'block';
      const select = document.getElementById('select-target');
      select.innerHTML = '';
      gameState.players.forEach((p, i) => {
        if (i !== gameState.currentTurn && p.reputation > 0) {
          select.innerHTML += `<option value="${i}">${p.name}</option>`;
        }
      });
    } else {
      targetBox.style.display = 'none';
    }
  }

  function submitAction() {
    if (!gameState.selectedCard) return alert("اختر بطاقة أولاً");

    let targetIdx = null;
    if (gameState.selectedCard.requiresTarget) {
      targetIdx = parseInt(document.getElementById('select-target').value);
    }

    gameState.actions.push({
      playerIdx: gameState.currentTurn,
      card: gameState.selectedCard,
      targetIdx: targetIdx
    });

    nextTurn();
  }

  function nextTurn() {
    gameState.currentTurn++;
    if (gameState.currentTurn < gameState.players.length) {
      showCurtain();
    } else {
      resolveRoundServer();
    }
  }

  async function resolveRoundServer() {
    document.getElementById('phase-action').style.display = 'none';
    document.getElementById('phase-debate').style.display = 'block';
    document.getElementById('ui-narrative').innerText = "جاري كتابة تقرير القاضي...";

    const res = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'resolve_round', players: gameState.players, actions: gameState.actions })
    });

    const data = await res.json();
    gameState.players = data.players;
    document.getElementById('ui-narrative').innerText = data.narrative;
    renderStatus();
  }

  function startGroupVote() {
    document.getElementById('phase-debate').style.display = 'none';
    document.getElementById('phase-vote').style.display = 'block';

    const select = document.getElementById('select-group-accused');
    select.innerHTML = '<option value="">-- التغاضي (عدم اتهام أحد) --</option>';
    gameState.players.forEach((p, i) => {
      if (p.reputation > 0) select.innerHTML += `<option value="${i}">${p.name}</option>`;
    });
  }

  async function processGroupVote() {
    const val = document.getElementById('select-group-accused').value;
    const accusedIdx = val !== "" ? parseInt(val) : null;

    const res = await fetch('/api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'resolve_group_vote',
        players: gameState.players,
        accusedIdx: accusedIdx,
        actions: gameState.actions
      })
    });

    const data = await res.json();
    gameState.players = data.players;
    alert(data.msg);

    const alive = gameState.players.filter(p => p.reputation > 0);
    if (alive.length <= 1) {
      alert(`🎉 انتهت اللعبة! الفائز هو: ${alive[0]?.name || "لا أحد"}`);
      location.reload();
    } else {
      startRound();
    }
  }
</script>
</body>
</html>
